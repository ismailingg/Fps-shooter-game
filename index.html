<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON BREACH — CO-OP FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; font-family: "Segoe UI", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
    transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: #4dffd2; box-shadow: 0 0 6px #4dffd2;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair.hit { filter: hue-rotate(120deg) brightness(1.6); }

  .panel { position: absolute; color: #dff; letter-spacing: 1px; text-shadow: 0 0 10px rgba(77,255,210,.6); }
  #stats { left: 28px; bottom: 24px; font-size: 15px; line-height: 1.9; }
  #stats b { color: #4dffd2; font-size: 26px; text-shadow: 0 0 14px #4dffd2; }

  #healthWrap { left: 28px; bottom: 118px; width: 260px; }
  #healthBar {
    height: 16px; width: 100%; background: rgba(255,255,255,.08);
    border: 1px solid rgba(77,255,210,.35); border-radius: 3px; overflow: hidden;
  }
  #healthFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff3b6b, #ffb14d);
    box-shadow: 0 0 18px rgba(255,59,107,.7) inset; transition: width .15s ease;
  }
  #healthWrap span { font-size: 12px; opacity: .8; }

  #ammo { right: 34px; bottom: 26px; text-align: right; font-size: 16px; }
  #ammo b { display: block; font-size: 40px; color: #4dffd2; text-shadow: 0 0 16px #4dffd2; }
  #ammo.reloading b { color: #ffb14d; text-shadow: 0 0 16px #ffb14d; }

  #wave { right: 34px; top: 26px; text-align: right; font-size: 15px; }
  #wave b { display: block; font-size: 30px; color: #b98bff; text-shadow: 0 0 16px #b98bff; }

  #board {
    left: 28px; top: 24px; font-size: 13px; line-height: 1.75; letter-spacing: 1px;
    color: #cfe; min-width: 200px;
  }
  #board .row { display: flex; justify-content: space-between; gap: 20px; }
  #board .me { color: #4dffd2; text-shadow: 0 0 10px #4dffd2; }
  #board .down { opacity: .4; text-decoration: line-through; }
  #board h4 { font-size: 11px; opacity: .55; font-weight: 700; margin-bottom: 3px; letter-spacing: 3px; }

  #feed { left: 28px; top: 150px; font-size: 12px; line-height: 1.7; color: #9fb8d8; max-width: 320px; }
  #feed div { opacity: .0; animation: fade 6s forwards; }
  @keyframes fade { 0%{opacity:0} 8%{opacity:.9} 75%{opacity:.9} 100%{opacity:0} }

  #damage {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 220px 60px rgba(255,20,60,.85); transition: opacity .12s ease;
  }
  #announce {
    position: fixed; left: 50%; top: 34%; transform: translate(-50%,-50%);
    font-size: 46px; font-weight: 800; letter-spacing: 4px; color: #b98bff;
    text-shadow: 0 0 26px #b98bff; opacity: 0; transition: opacity .3s ease; pointer-events: none;
  }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at center, rgba(20,10,40,.82), rgba(4,4,10,.96));
    color: #eef; z-index: 10;
  }
  .overlay h1 {
    font-size: 64px; letter-spacing: 10px; font-weight: 900;
    background: linear-gradient(90deg, #4dffd2, #b98bff, #ff3b6b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(120,180,255,.35));
  }
  .overlay p { margin-top: 14px; font-size: 16px; opacity: .82; max-width: 560px; line-height: 1.7; }
  .overlay .key { color: #4dffd2; font-weight: 700; }
  .btn {
    margin-top: 30px; padding: 15px 44px; font-size: 18px; letter-spacing: 3px; font-weight: 700;
    color: #05060a; background: linear-gradient(90deg, #4dffd2, #7ef);
    border: none; border-radius: 4px; cursor: pointer; pointer-events: auto;
    box-shadow: 0 0 30px rgba(77,255,210,.55); transition: transform .1s ease;
  }
  .btn:hover { transform: scale(1.05); }
  #nameInput {
    margin-top: 26px; width: 300px; padding: 12px 16px; font-size: 16px; letter-spacing: 3px;
    text-align: center; text-transform: uppercase; color: #4dffd2; pointer-events: auto;
    background: rgba(77,255,210,.06); border: 1px solid rgba(77,255,210,.4);
    border-radius: 4px; outline: none;
  }
  #nameInput::placeholder { color: rgba(200,255,240,.35); }
  #netLine { margin-top: 18px; font-size: 13px; letter-spacing: 1px; opacity: .7; }
  #netLine b { color: #4dffd2; }
  .hidden { display: none !important; }
  #finalStats { margin-top: 20px; font-size: 21px; color: #4dffd2; text-shadow: 0 0 14px #4dffd2; }
  .foot { position: fixed; bottom: 16px; font-size: 12px; opacity: .4; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="board" class="panel"><h4>SQUAD</h4><div id="boardRows"></div></div>
  <div id="feed"></div>
  <div id="healthWrap" class="panel"><span>INTEGRITY</span><div id="healthBar"><div id="healthFill"></div></div></div>
  <div id="stats" class="panel">SCORE<br /><b id="score">0</b><br />KILLS <span id="kills">0</span></div>
  <div id="ammo" class="panel"><span>MAG</span><b id="ammoCount">30</b><span id="ammoReserve">/ 120</span></div>
  <div id="wave" class="panel">WAVE<br /><b id="waveNum">1</b><span id="enemiesLeft">0 hostiles</span></div>
  <div id="announce"></div>
</div>
<div id="damage"></div>

<div id="startScreen" class="overlay">
  <h1>NEON BREACH</h1>
  <p>
    Co-op survival on the grid. Hold the line together.<br /><br />
    <span class="key">WASD</span> move &nbsp;·&nbsp; <span class="key">MOUSE</span> aim &nbsp;·&nbsp;
    <span class="key">CLICK</span> fire &nbsp;·&nbsp; <span class="key">SHIFT</span> sprint &nbsp;·&nbsp;
    <span class="key">R</span> reload &nbsp;·&nbsp; <span class="key">SPACE</span> jump
  </p>
  <input id="nameInput" maxlength="16" placeholder="CALLSIGN" autocomplete="off" />
  <button id="startBtn" class="btn">ENGAGE</button>
  <div id="netLine">checking for server&hellip;</div>
  <div class="foot">WEBGL / THREE.JS · NODE CO-OP SERVER</div>
</div>

<div id="gameOver" class="overlay hidden">
  <h1 id="goTitle">GRID LOST</h1>
  <div id="finalStats"></div>
  <button id="restartBtn" class="btn">REDEPLOY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
"use strict";
const T = window.THREE;

/* ========================================================================
   Renderer / scene / camera
   ====================================================================== */
const container = document.getElementById("game");
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x05060a);
scene.fog = new T.FogExp2(0x05060a, 0.022);

const camera = new T.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.05, 400);
const yawObject = new T.Object3D();
const pitchObject = new T.Object3D();
yawObject.add(pitchObject);
pitchObject.add(camera);
yawObject.position.set(0, 1.7, 0);
scene.add(yawObject);

/* ========================================================================
   Lighting
   ====================================================================== */
scene.add(new T.HemisphereLight(0x334466, 0x0a0a12, 0.6));
const moon = new T.DirectionalLight(0x8facff, 0.65);
moon.position.set(30, 50, 20);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -60; moon.shadow.camera.right = 60;
moon.shadow.camera.top = 60; moon.shadow.camera.bottom = -60;
moon.shadow.camera.far = 160;
scene.add(moon);

const muzzleLight = new T.PointLight(0x9effe0, 0, 14, 2);
muzzleLight.position.set(0.25, -0.2, -0.6);
camera.add(muzzleLight);

/* ========================================================================
   Arena
   ====================================================================== */
const ARENA = 46;
const worldColliders = [];
function addBoxCollider(mesh) {
  mesh.updateMatrixWorld(true);
  worldColliders.push(new T.Box3().setFromObject(mesh));
}

const floor = new T.Mesh(
  new T.PlaneGeometry(ARENA * 2, ARENA * 2),
  new T.MeshStandardMaterial({ color: 0x0b0e18, roughness: 0.85, metalness: 0.2 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new T.GridHelper(ARENA * 2, 46, 0x2affc7, 0x123a44);
grid.position.y = 0.02;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

const wallMat = new T.MeshStandardMaterial({ color: 0x141a2e, roughness: 0.6, metalness: 0.35, emissive: 0x0a1830, emissiveIntensity: 0.4 });
function makeWall(w, h, d, x, y, z) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, d), wallMat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  addBoxCollider(m);
  const trim = new T.Mesh(new T.BoxGeometry(w + 0.05, 0.12, d + 0.05), new T.MeshBasicMaterial({ color: 0x4dffd2 }));
  trim.position.set(x, y + h / 2 - 0.4, z);
  scene.add(trim);
}
makeWall(ARENA * 2, 8, 1, 0, 4, -ARENA);
makeWall(ARENA * 2, 8, 1, 0, 4, ARENA);
makeWall(1, 8, ARENA * 2, -ARENA, 4, 0);
makeWall(1, 8, ARENA * 2, ARENA, 4, 0);

const coverMat = new T.MeshStandardMaterial({ color: 0x1b2140, roughness: 0.5, metalness: 0.5, emissive: 0x241063, emissiveIntensity: 0.5 });
const coverPositions = [
  [-12, -10], [14, -16], [-20, 8], [22, 14], [0, -24], [-6, 20],
  [30, -4], [-30, -18], [8, 6], [-16, -26], [18, 26], [-26, 24],
];
let seed = 1337;
const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
for (const [x, z] of coverPositions) {
  const h = 2 + rand() * 3;
  const c = new T.Mesh(new T.BoxGeometry(2.4, h, 2.4), coverMat);
  c.position.set(x, h / 2, z);
  c.castShadow = c.receiveShadow = true;
  c.rotation.y = rand() * Math.PI;
  scene.add(c);
  addBoxCollider(c);
  const cap = new T.Mesh(new T.BoxGeometry(2.5, 0.12, 2.5), new T.MeshBasicMaterial({ color: 0xb98bff }));
  cap.position.set(x, h + 0.02, z);
  cap.rotation.y = c.rotation.y;
  scene.add(cap);
}

const farMat = new T.MeshBasicMaterial({ color: 0x0c1024 });
for (let i = 0; i < 60; i++) {
  const a = rand() * Math.PI * 2;
  const r = ARENA + 8 + rand() * 90;
  const hh = 6 + rand() * 40;
  const p = new T.Mesh(new T.BoxGeometry(2 + rand() * 5, hh, 2 + rand() * 5), farMat);
  p.position.set(Math.cos(a) * r, hh / 2 - 2, Math.sin(a) * r);
  scene.add(p);
}

const starGeo = new T.BufferGeometry();
const starPos = new Float32Array(900 * 3);
for (let i = 0; i < 900; i++) {
  const a = rand() * Math.PI * 2;
  const r = 120 + rand() * 160;
  starPos[i * 3] = Math.cos(a) * r;
  starPos[i * 3 + 1] = rand() * 120 + 8;
  starPos[i * 3 + 2] = Math.sin(a) * r;
}
starGeo.setAttribute("position", new T.BufferAttribute(starPos, 3));
scene.add(new T.Points(starGeo, new T.PointsMaterial({ color: 0x9fb8ff, size: 0.7 })));

/* ========================================================================
   Weapon viewmodel
   ====================================================================== */
const weapon = new T.Group();
camera.add(weapon);
weapon.position.set(0.3, -0.26, -0.5);
weapon.scale.setScalar(0.82);

const gunMetal = new T.MeshStandardMaterial({ color: 0x20242e, roughness: 0.35, metalness: 0.85 });
const gunAccent = new T.MeshStandardMaterial({ color: 0x4dffd2, emissive: 0x1f6f5c, emissiveIntensity: 0.8, roughness: 0.3, metalness: 0.6 });
function gpart(geo, mat, x, y, z) { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); weapon.add(m); return m; }
gpart(new T.BoxGeometry(0.12, 0.14, 0.5), gunMetal, 0, 0, 0.05);
const barrel = gpart(new T.CylinderGeometry(0.028, 0.028, 0.42, 12), gunMetal, 0, 0.02, -0.32);
barrel.rotation.x = Math.PI / 2;
gpart(new T.BoxGeometry(0.03, 0.06, 0.12), gunAccent, 0, 0.11, 0.02);
gpart(new T.BoxGeometry(0.08, 0.2, 0.1), gunMetal, 0, -0.14, 0.12);
const grip = gpart(new T.BoxGeometry(0.07, 0.16, 0.09), gunMetal, 0, -0.14, 0.22);
grip.rotation.x = 0.35;
gpart(new T.BoxGeometry(0.125, 0.02, 0.3), gunAccent, 0, 0.075, 0.05);

const flashMat = new T.SpriteMaterial({ color: 0x9effe0, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false });
const flash = new T.Sprite(flashMat);
flash.scale.set(0.5, 0.5, 0.5);
flash.position.set(0, 0.02, -0.55);
weapon.add(flash);
const weaponRest = weapon.position.clone();

/* ========================================================================
   FX pools: tracers + particle bursts
   ====================================================================== */
const tracerMat = new T.MeshBasicMaterial({ color: 0x9effe0, transparent: true, opacity: 0.9, blending: T.AdditiveBlending, depthWrite: false });
const tracers = [];
function spawnTracer(from, to) {
  const dir = new T.Vector3().subVectors(to, from);
  const len = dir.length();
  if (len < 0.01) return;
  const m = new T.Mesh(new T.CylinderGeometry(0.015, 0.015, len, 6), tracerMat.clone());
  m.position.copy(from).add(dir.clone().multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir.clone().normalize());
  m.userData.life = 0.08;
  scene.add(m);
  tracers.push(m);
}

const bursts = [];
function spawnBurst(pos, color, count, speed, sz) {
  const geo = new T.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const vel = [];
  for (let i = 0; i < count; i++) {
    positions[i * 3] = pos.x; positions[i * 3 + 1] = pos.y; positions[i * 3 + 2] = pos.z;
    const v = new T.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5)
      .normalize().multiplyScalar(speed * (0.4 + Math.random() * 0.8));
    v.y += speed * 0.35;
    vel.push(v);
  }
  geo.setAttribute("position", new T.BufferAttribute(positions, 3));
  const pts = new T.Points(geo, new T.PointsMaterial({ color, size: sz || 0.16, transparent: true, opacity: 1, blending: T.AdditiveBlending, depthWrite: false }));
  pts.userData = { vel, life: 0.7, max: 0.7 };
  scene.add(pts);
  bursts.push(pts);
}

/* ========================================================================
   Enemy meshes  (AI is server-side when online; local when solo)
   ====================================================================== */
const enemies = [];               // array of enemy objects, each has .id
const enemyRaycastTargets = [];
let localEnemyId = -1;            // negative ids => locally simulated

function kindColor(kind) {
  return kind === "heavy" ? 0xff4d6d : kind === "fast" ? 0xffd24d : 0xb98bff;
}
function kindEmissive(kind) {
  return kind === "heavy" ? 0x5c1226 : kind === "fast" ? 0x5c4712 : 0x3a1b6b;
}

function makeEnemy(kind, opts) {
  opts = opts || {};
  const g = new T.Group();
  const base = kindColor(kind);
  const emissive = kindEmissive(kind);
  const skin = new T.MeshStandardMaterial({ color: base, emissive, emissiveIntensity: 0.6, roughness: 0.4, metalness: 0.6 });
  const dark = new T.MeshStandardMaterial({ color: 0x14161f, roughness: 0.6, metalness: 0.7 });
  const scale = kind === "heavy" ? 1.5 : kind === "fast" ? 0.8 : 1;

  const torso = new T.Mesh(new T.BoxGeometry(0.8, 1.0, 0.5), skin);
  torso.position.y = 1.15; torso.castShadow = true; g.add(torso);
  const head = new T.Mesh(new T.BoxGeometry(0.42, 0.42, 0.42), dark);
  head.position.y = 1.9; head.castShadow = true; g.add(head);
  const eye = new T.Mesh(new T.BoxGeometry(0.3, 0.08, 0.02), new T.MeshBasicMaterial({ color: base }));
  eye.position.set(0, 1.92, 0.22); g.add(eye);
  const armL = new T.Mesh(new T.BoxGeometry(0.16, 0.8, 0.16), skin);
  const armR = armL.clone();
  armL.position.set(-0.52, 1.2, 0); armR.position.set(0.52, 1.2, 0);
  armL.castShadow = armR.castShadow = true; g.add(armL); g.add(armR);
  const legL = new T.Mesh(new T.BoxGeometry(0.2, 0.9, 0.2), dark);
  const legR = legL.clone();
  legL.position.set(-0.2, 0.45, 0); legR.position.set(0.2, 0.45, 0);
  legL.castShadow = legR.castShadow = true; g.add(legL); g.add(legR);

  g.scale.setScalar(scale);
  const a = Math.random() * Math.PI * 2, r = ARENA - 4;
  g.position.set(opts.x != null ? opts.x : Math.cos(a) * r, 0, opts.z != null ? opts.z : Math.sin(a) * r);
  scene.add(g);

  const hp = kind === "heavy" ? 9 : kind === "fast" ? 2 : 4;
  const speed = kind === "heavy" ? 1.7 : kind === "fast" ? 5.2 : 3.1;
  const e = {
    id: opts.id != null ? opts.id : localEnemyId--,
    group: g, torso, head, armL, armR, legL, legR,
    hp, maxHp: hp, speed, kind, scale,
    phase: Math.random() * Math.PI * 2, dead: false, dying: 0, hitFlash: 0, attackCd: 0,
    radius: 0.6 * scale, state: "walk",
    tx: g.position.x, tz: g.position.z, tyaw: 0,
  };
  torso.userData.enemy = e; head.userData.enemy = e;
  enemyRaycastTargets.push(torso, head);
  enemies.push(e);
  return e;
}

function enemyById(id) {
  for (const e of enemies) if (e.id === id) return e;
  return null;
}

function removeEnemy(e) {
  scene.remove(e.group);
  for (const t of [e.torso, e.head]) {
    const i = enemyRaycastTargets.indexOf(t);
    if (i >= 0) enemyRaycastTargets.splice(i, 1);
  }
  const i = enemies.indexOf(e);
  if (i >= 0) enemies.splice(i, 1);
}

function startEnemyDeath(e, fromKill) {
  if (e.dead) return;
  e.dead = true;
  e.dying = 0.6;
  const p = e.group.position.clone(); p.y = 1;
  spawnBurst(p, kindColor(e.kind), 34, 6, 0.2);
  sfx.kill();
  for (const t of [e.torso, e.head]) {
    const i = enemyRaycastTargets.indexOf(t);
    if (i >= 0) enemyRaycastTargets.splice(i, 1);
  }
  if (fromKill && NET.mode === "offline") {
    state.kills++;
    state.score += e.kind === "heavy" ? 150 : e.kind === "fast" ? 90 : 60;
  }
}

/* ========================================================================
   Remote players
   ====================================================================== */
const remotePlayers = new Map(); // id -> { group, torso, legL, legR, armL, armR, sprite, tx,ty,tz, tRY, moving, phase }

function makeNameSprite(text) {
  const cv = document.createElement("canvas");
  cv.width = 256; cv.height = 64;
  const cx = cv.getContext("2d");
  cx.font = "bold 34px Segoe UI, sans-serif";
  cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.fillStyle = "rgba(77,255,210,0.95)";
  cx.shadowColor = "rgba(77,255,210,0.9)"; cx.shadowBlur = 12;
  cx.fillText(text.toUpperCase().slice(0, 16), 128, 34);
  const tex = new T.CanvasTexture(cv);
  const spr = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  spr.scale.set(2.2, 0.55, 1);
  spr.position.y = 2.7;
  return spr;
}

function makeAvatar(name) {
  const g = new T.Group();
  const skin = new T.MeshStandardMaterial({ color: 0x2ad1ff, emissive: 0x0d5c78, emissiveIntensity: 0.7, roughness: 0.4, metalness: 0.6 });
  const dark = new T.MeshStandardMaterial({ color: 0x10141c, roughness: 0.6, metalness: 0.7 });
  const torso = new T.Mesh(new T.BoxGeometry(0.7, 0.95, 0.42), skin);
  torso.position.y = 1.2; torso.castShadow = true; g.add(torso);
  const head = new T.Mesh(new T.BoxGeometry(0.4, 0.4, 0.4), dark);
  head.position.y = 1.9; head.castShadow = true; g.add(head);
  const visor = new T.Mesh(new T.BoxGeometry(0.3, 0.08, 0.02), new T.MeshBasicMaterial({ color: 0x4dffd2 }));
  visor.position.set(0, 1.92, 0.21); g.add(visor);
  const armL = new T.Mesh(new T.BoxGeometry(0.15, 0.75, 0.15), skin);
  const armR = armL.clone();
  armL.position.set(-0.46, 1.25, 0); armR.position.set(0.46, 1.25, 0);
  g.add(armL); g.add(armR);
  const legL = new T.Mesh(new T.BoxGeometry(0.19, 0.85, 0.19), dark);
  const legR = legL.clone();
  legL.position.set(-0.17, 0.45, 0); legR.position.set(0.17, 0.45, 0);
  g.add(legL); g.add(legR);
  // stub gun
  const gun = new T.Mesh(new T.BoxGeometry(0.12, 0.12, 0.5), new T.MeshStandardMaterial({ color: 0x20242e, metalness: 0.8, roughness: 0.4 }));
  gun.position.set(0.38, 1.35, -0.25); g.add(gun);
  const sprite = makeNameSprite(name);
  g.add(sprite);
  scene.add(g);
  return { group: g, torso, head, armL, armR, legL, legR, sprite, phase: 0, tx: 0, ty: 0, tz: 0, tRY: 0, moving: false };
}

function updateRemotePlayers(dt) {
  for (const rp of remotePlayers.values()) {
    const k = 1 - Math.pow(0.0015, dt);
    rp.group.position.x += (rp.tx - rp.group.position.x) * k;
    rp.group.position.y += (rp.ty - 1.7 - rp.group.position.y) * k;
    rp.group.position.z += (rp.tz - rp.group.position.z) * k;
    let dy = rp.tRY - rp.group.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    rp.group.rotation.y += dy * Math.min(1, dt * 10);
    if (rp.moving) {
      rp.phase += dt * 11;
      const s = Math.sin(rp.phase);
      rp.legL.rotation.x = s * 0.8; rp.legR.rotation.x = -s * 0.8;
      rp.armL.rotation.x = -s * 0.6; rp.armR.rotation.x = s * 0.6;
    } else {
      rp.legL.rotation.x *= 0.8; rp.legR.rotation.x *= 0.8;
      rp.armL.rotation.x *= 0.8; rp.armR.rotation.x *= 0.8;
    }
  }
}

/* ========================================================================
   Audio
   ====================================================================== */
let actx = null;
function audioInit() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
function tone(freq, dur, type, gain, slideTo) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, actx.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
  g.gain.setValueAtTime(gain || 0.2, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function noise(dur, gain, filterFreq) {
  if (!actx) return;
  const n = actx.createBufferSource();
  const buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  n.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = filterFreq || 1200;
  const g = actx.createGain();
  g.gain.setValueAtTime(gain || 0.2, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  n.connect(f); f.connect(g); g.connect(actx.destination);
  n.start(); n.stop(actx.currentTime + dur);
}
const sfx = {
  shoot() { tone(320, 0.08, "square", 0.13, 90); noise(0.09, 0.16, 2400); },
  shootFar() { tone(260, 0.07, "square", 0.05, 90); noise(0.08, 0.05, 1400); },
  hit() { tone(600, 0.05, "sine", 0.12, 900); },
  kill() { tone(180, 0.25, "sawtooth", 0.18, 40); noise(0.25, 0.14, 800); },
  hurt() { tone(140, 0.22, "sawtooth", 0.22, 60); },
  reload() { tone(240, 0.05, "square", 0.1); setTimeout(() => tone(360, 0.06, "square", 0.1), 140); },
  wave() { tone(440, 0.18, "triangle", 0.16, 660); setTimeout(() => tone(660, 0.22, "triangle", 0.16, 880), 160); },
  empty() { tone(120, 0.05, "square", 0.08); },
};

/* ========================================================================
   Networking
   ====================================================================== */
const NET = { ws: null, mode: "connecting", self: 0, name: "PLAYER" };

function wsURL() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return proto + "//" + location.host;
}

function netConnect(onResult) {
  let settled = false;
  const done = (mode) => { if (settled) return; settled = true; NET.mode = mode; onResult(mode); };

  let ws;
  try { ws = new WebSocket(wsURL()); }
  catch (_) { return done("offline"); }
  NET.ws = ws;

  const timeout = setTimeout(() => { if (!settled) { try { ws.close(); } catch (_) {} done("offline"); } }, 2500);

  ws.onopen = () => {
    clearTimeout(timeout);
    ws.send(JSON.stringify({ t: "join", name: NET.name }));
    done("online");
  };
  ws.onerror = () => { clearTimeout(timeout); done("offline"); };
  ws.onclose = () => {
    if (settled && NET.mode === "online") {
      NET.mode = "offline";
      pushFeed("connection lost — solo mode");
    } else {
      clearTimeout(timeout);
      done("offline");
    }
  };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    handleNet(m);
  };
}

function netSend(obj) {
  if (NET.mode === "online" && NET.ws && NET.ws.readyState === 1) {
    NET.ws.send(JSON.stringify(obj));
  }
}

function handleNet(m) {
  switch (m.t) {
    case "init":
      NET.self = m.id;
      break;

    case "snap":
      applySnapshot(m);
      break;

    case "shot":
      if (m.id === NET.self) break;
      spawnTracer(new T.Vector3(m.ox, m.oy, m.oz), new T.Vector3(m.ex, m.ey, m.ez));
      spawnBurst(new T.Vector3(m.ex, m.ey, m.ez), 0x9effe0, 5, 3, 0.1);
      {
        const d = yawObject.position.distanceTo(new T.Vector3(m.ox, m.oy, m.oz));
        if (d < 40) (d < 12 ? sfx.shoot() : sfx.shootFar());
      }
      break;

    case "ehit": {
      const e = enemyById(m.id);
      if (e && !e.dead) { e.hitFlash = 1; }
      spawnBurst(new T.Vector3(m.x, 1.1, m.z), m.head ? 0xffffff : 0x9effe0, m.head ? 12 : 7, 4, 0.13);
      break;
    }

    case "kill": {
      const e = enemyById(m.id);
      if (e) startEnemyDeath(e, false);
      if (m.by === NET.self) showHitMarker();
      else pushFeed(m.byName + " fragged a " + m.kind);
      break;
    }

    case "hurt":
      if (state.running) { flashDamage(); sfx.hurt(); state.sinceHit = 0; }
      break;

    case "playerDown":
      if (m.id === NET.self) { if (state.running) endGame(false); }
      else { pushFeed(m.name + " is DOWN"); }
      break;

    case "announce":
      announce(m.text, 1500);
      if (/WAVE/.test(m.text)) sfx.wave();
      break;

    case "sys":
      pushFeed(m.text);
      break;

    case "left": {
      const rp = remotePlayers.get(m.id);
      if (rp) { scene.remove(rp.group); remotePlayers.delete(m.id); }
      break;
    }
  }
}

function applySnapshot(m) {
  // players
  const seen = new Set();
  for (const sp of m.ps) {
    seen.add(sp.id);
    if (sp.id === NET.self) {
      if (state.running) {
        state.health = sp.hp;
        state.score = sp.sc;
        state.kills = sp.k;
        state.alive = !!sp.a;
      }
      continue;
    }
    let rp = remotePlayers.get(sp.id);
    if (!rp) { rp = makeAvatar(sp.n || "PLAYER"); remotePlayers.set(sp.id, rp); }
    rp.tx = sp.x; rp.ty = sp.y; rp.tz = sp.z; rp.tRY = sp.ry;
    rp.moving = !!sp.mv;
    rp.group.visible = !!sp.a;
    rp._name = sp.n; rp._sc = sp.sc; rp._alive = !!sp.a; rp._id = sp.id;
  }
  for (const [id, rp] of remotePlayers) {
    if (!seen.has(id)) { scene.remove(rp.group); remotePlayers.delete(id); }
  }

  // enemies
  const eseen = new Set();
  for (const se of m.es) {
    eseen.add(se.id);
    let e = enemyById(se.id);
    if (!e) {
      if (se.s === "dead") continue;
      e = makeEnemy(se.k, { id: se.id, x: se.x, z: se.z });
    }
    if (e.dead) continue;
    e.tx = se.x; e.tz = se.z; e.tyaw = se.y;
    e.serverState = se.s;
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.id >= 0 && !eseen.has(e.id) && !e.dead) removeEnemy(e);
  }

  state.wave = m.wave;
  if (NET.mode === "online") { state.score = m.score; state.kills = m.kills; }
  updateBoard(m.ps);
}

const hud = document.getElementById("hud");
const el = (id) => document.getElementById(id);

function updateHUD() {
  el("score").textContent = state.score;

function updateBoard(ps) {
  const rows = ps.slice().sort((a, b) => b.sc - a.sc).map((sp) => {
    const me = sp.id === NET.self ? " me" : "";
    const down = sp.a ? "" : " down";
    return `<div class="row${me}${down}"><span>${(sp.n || "PLAYER").slice(0, 14)}</span><span>${sp.sc}</span></div>`;
  }).join("");
  el("boardRows").innerHTML = rows;
}

function announce(text, ms) {
  const a = el("announce");
  a.textContent = text;
  a.style.opacity = "1";
  clearTimeout(announce._t);
  announce._t = setTimeout(() => { a.style.opacity = "0"; }, ms || 1600);
}
function flashDamage() {
  const d = el("damage");
  d.style.opacity = "0.9";
  setTimeout(() => { d.style.opacity = "0"; }, 120);
}
function pushFeed(text) {
  const f = el("feed");
  const div = document.createElement("div");
  div.textContent = "» " + text;
  f.appendChild(div);
  while (f.childNodes.length > 6) f.removeChild(f.firstChild);
  setTimeout(() => { if (div.parentNode) div.parentNode.removeChild(div); }, 6000);
}

/* ========================================================================
   Shooting
   ====================================================================== */
const raycaster = new T.Raycaster();
const shotOrigin = new T.Vector3();
const shotDir = new T.Vector3();
let recoil = 0;
let firing = false;

function reload() {
  if (state.reloading || state.mag === state.magSize || state.reserve <= 0 || !state.running || !state.alive) return;
  state.reloading = true;
  state.reloadT = 1.05;
  sfx.reload();
}
function finishReload() {
  const take = Math.min(state.magSize - state.mag, state.reserve);
  state.mag += take;
  state.reserve -= take;
  state.reloading = false;
}

function shoot() {
  if (state.reloading || state.fireCd > 0 || !state.alive) return;
  if (state.mag <= 0) { sfx.empty(); state.fireCd = 0.18; return; }

  state.mag--;
  state.fireCd = 0.092;
  recoil = 1;
  sfx.shoot();
  muzzleLight.intensity = 4;
  flashMat.opacity = 1;
  flash.material.rotation = Math.random() * Math.PI;

  camera.getWorldPosition(shotOrigin);
  camera.getWorldDirection(shotDir);
  shotDir.x += (Math.random() - 0.5) * 0.012;
  shotDir.y += (Math.random() - 0.5) * 0.012;
  shotDir.normalize();

  raycaster.set(shotOrigin, shotDir);
  raycaster.far = 200;
  const hits = raycaster.intersectObjects(enemyRaycastTargets, false);
  let endPoint;

  if (hits.length) {
    const h = hits[0];
    endPoint = h.point.clone();
    const e = h.object.userData.enemy;
    if (e && !e.dead) {
      const head = h.object === e.head;
      const dmg = head ? 3 : 1.4;
      e.hitFlash = 1;
      e.group.userData.knock = shotDir.clone().multiplyScalar(head ? 0.5 : 0.28);
      spawnBurst(endPoint, head ? 0xffffff : 0x9effe0, head ? 16 : 9, 4, 0.14);
      sfx.hit();
      showHitMarker();
      if (NET.mode === "online") {
        netSend({ t: "hit", id: e.id, dmg, head });
      } else {
        e.hp -= dmg;
        if (e.hp <= 0) startEnemyDeath(e, true);
      }
    }
  } else {
    endPoint = shotOrigin.clone().add(shotDir.clone().multiplyScalar(120));
  }

  const from = shotOrigin.clone().add(shotDir.clone().multiplyScalar(0.6));
  spawnTracer(from, endPoint);
  netSend({
    t: "shoot",
    ox: +from.x.toFixed(2), oy: +from.y.toFixed(2), oz: +from.z.toFixed(2),
    ex: +endPoint.x.toFixed(2), ey: +endPoint.y.toFixed(2), ez: +endPoint.z.toFixed(2),
  });
}

function showHitMarker() {
  const c = el("crosshair");
  c.classList.add("hit");
  clearTimeout(showHitMarker._t);
  showHitMarker._t = setTimeout(() => c.classList.remove("hit"), 90);
}

/* ========================================================================
   Local waves (solo only)
   ====================================================================== */
function startWaveLocal(n) {
  state.wave = n;
  state.spawnQueue = 5 + n * 2;
  state.spawnTimer = 0;
  state.betweenWaves = 0;
  announce("WAVE " + n, 1500);
  sfx.wave();
}
function maybeSpawnLocal(dt) {
  if (state.spawnQueue > 0) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      const rng = Math.random();
      let kind = "grunt";
      if (state.wave >= 3 && rng < 0.18) kind = "heavy";
      else if (state.wave >= 2 && rng < 0.5) kind = "fast";
      makeEnemy(kind);
      state.spawnQueue--;
      state.spawnTimer = Math.max(0.35, 1.4 - state.wave * 0.08);
    }
  } else if (enemies.filter((e) => !e.dead).length === 0) {
    state.betweenWaves += dt;
    if (state.betweenWaves.toFixed(2) === dt.toFixed(2)) announce("SECTOR CLEAR", 1400);
    if (state.betweenWaves > 2.5) { state.reserve += 40; startWaveLocal(state.wave + 1); }
  }
}

/* ========================================================================
   Player movement
   ====================================================================== */
const PLAYER_R = 0.4;
const moveDir = new T.Vector3();
const forward = new T.Vector3();
const right = new T.Vector3();
let bobT = 0;

function collideBox(pos, r) {
  for (const box of worldColliders) {
    const minX = box.min.x - r, maxX = box.max.x + r;
    const minZ = box.min.z - r, maxZ = box.max.z + r;
    if (pos.x > minX && pos.x < maxX && pos.z > minZ && pos.z < maxZ && pos.y < box.max.y + 0.2) {
      const push = [
        { d: pos.x - minX, ax: "x", v: minX },
        { d: maxX - pos.x, ax: "x", v: maxX },
        { d: pos.z - minZ, ax: "z", v: minZ },
        { d: maxZ - pos.z, ax: "z", v: maxZ },
      ].sort((a, b) => a.d - b.d)[0];
      pos[push.ax] = push.v;
    }
  }
  pos.x = Math.max(-ARENA + 1, Math.min(ARENA - 1, pos.x));
  pos.z = Math.max(-ARENA + 1, Math.min(ARENA - 1, pos.z));
}

function updatePlayer(dt) {
  forward.set(0, 0, -1).applyQuaternion(yawObject.quaternion);
  right.set(1, 0, 0).applyQuaternion(yawObject.quaternion);
  forward.y = right.y = 0; forward.normalize(); right.normalize();

  moveDir.set(0, 0, 0);
  if (state.alive) {
    if (keys["KeyW"]) moveDir.add(forward);
    if (keys["KeyS"]) moveDir.sub(forward);
    if (keys["KeyD"]) moveDir.add(right);
    if (keys["KeyA"]) moveDir.sub(right);
  }

  const sprint = keys["ShiftLeft"] || keys["ShiftRight"];
  const speed = sprint ? 8.4 : 5.2;
  const moving = moveDir.lengthSq() > 0;
  state.moving = moving;

  if (moving) {
    moveDir.normalize().multiplyScalar(speed * dt);
    const np = yawObject.position.clone();
    np.x += moveDir.x; np.z += moveDir.z;
    collideBox(np, PLAYER_R);
    yawObject.position.x = np.x;
    yawObject.position.z = np.z;
  }

  state.velY -= 14 * dt;
  yawObject.position.y += state.velY * dt;
  if (yawObject.position.y <= 1.7) { yawObject.position.y = 1.7; state.velY = 0; state.onGround = true; }

  const bobTarget = moving && state.onGround ? (sprint ? 1.5 : 1) : 0;
  bobT += dt * (moving ? (sprint ? 16 : 11) : 8);
  const bob = Math.sin(bobT) * 0.035 * bobTarget;
  const bobX = Math.cos(bobT * 0.5) * 0.03 * bobTarget;
  camera.position.y = bob;
  camera.position.x = bobX;

  recoil = Math.max(0, recoil - dt * 9);
  const sway = Math.sin(bobT) * 0.006 * bobTarget;
  weapon.position.x = weaponRest.x + bobX * 0.5;
  weapon.position.y = weaponRest.y + bob * 0.5 + sway;
  weapon.position.z = weaponRest.z + recoil * 0.06;
  weapon.rotation.x = recoil * 0.18 + Math.sin(bobT * 0.5) * 0.01 * bobTarget;
  weapon.rotation.z = -bobX * 0.3;
  if (state.reloading) { weapon.rotation.x += 0.6; weapon.position.y -= 0.12; }
}

/* ========================================================================
   Enemy update — local AI (solo) OR interpolation (online)
   ====================================================================== */
const toPlayer = new T.Vector3();

function updateEnemiesOnline(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const g = e.group;

    if (e.dead) {
      e.dying -= dt;
      g.rotation.x -= dt * 4;
      g.position.y -= dt * 2.2;
      g.scale.multiplyScalar(1 - dt * 1.5);
      if (e.dying <= 0) removeEnemy(e);
      continue;
    }

    if (e.hitFlash > 0) {
      e.hitFlash -= dt * 4;
      const f = Math.max(0, e.hitFlash);
      e.torso.material.emissiveIntensity = 0.6 + f * 2.5;
      e.head.material.emissiveIntensity = f * 2.5;
    }

    const prevX = g.position.x, prevZ = g.position.z;
    const k = 1 - Math.pow(0.0009, dt);
    g.position.x += (e.tx - g.position.x) * k;
    g.position.z += (e.tz - g.position.z) * k;

    let dy = e.tyaw - g.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    g.rotation.y += dy * Math.min(1, dt * 10);

    const moved = Math.hypot(g.position.x - prevX, g.position.z - prevZ) / Math.max(dt, 0.001);

    if (e.serverState === "attack") {
      e.phase += dt * 10;
      e.armL.rotation.x = -1.2 - Math.sin(e.phase * 6) * 0.6;
      e.armR.rotation.x = -1.2 - Math.sin(e.phase * 6 + 1) * 0.6;
      e.legL.rotation.x = 0.2; e.legR.rotation.x = -0.2;
      g.position.y = 0;
    } else if (moved > 0.3) {
      e.phase += dt * (6 + Math.min(moved, 6));
      const sw = Math.sin(e.phase);
      e.legL.rotation.x = sw * 0.9; e.legR.rotation.x = -sw * 0.9;
      e.armL.rotation.x = -sw * 0.7; e.armR.rotation.x = sw * 0.7;
      e.torso.rotation.z = Math.sin(e.phase * 2) * 0.05;
      g.position.y = Math.abs(Math.sin(e.phase)) * 0.08;
    } else {
      e.legL.rotation.x *= 0.8; e.legR.rotation.x *= 0.8;
      e.armL.rotation.x *= 0.8; e.armR.rotation.x *= 0.8;
      g.position.y = 0;
    }
  }
}

function updateEnemiesLocal(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const g = e.group;

    if (e.dead) {
      e.dying -= dt;
      g.rotation.x -= dt * 4;
      g.position.y -= dt * 2.2;
      g.scale.multiplyScalar(1 - dt * 1.5);
      if (e.dying <= 0) removeEnemy(e);
      continue;
    }

    if (e.hitFlash > 0) {
      e.hitFlash -= dt * 4;
      const f = Math.max(0, e.hitFlash);
      e.torso.material.emissiveIntensity = 0.6 + f * 2.5;
      e.head.material.emissiveIntensity = f * 2.5;
    }
    if (g.userData.knock) {
      g.position.add(g.userData.knock);
      g.userData.knock.multiplyScalar(0.8);
      if (g.userData.knock.lengthSq() < 0.0004) g.userData.knock = null;
    }

    toPlayer.copy(yawObject.position).sub(g.position);
    toPlayer.y = 0;
    const dist = toPlayer.length();
    toPlayer.normalize();

    const targetYaw = Math.atan2(toPlayer.x, toPlayer.z);
    let dy = targetYaw - g.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    g.rotation.y += dy * Math.min(1, dt * 8);

    const attackRange = 1.7 * e.scale + 0.6;
    if (dist > attackRange) {
      const step = e.speed * dt;
      const np = g.position.clone();
      np.x += toPlayer.x * step;
      np.z += toPlayer.z * step;
      for (const o of enemies) {
        if (o === e || o.dead) continue;
        const dx = np.x - o.group.position.x;
        const dz = np.z - o.group.position.z;
        const d2 = dx * dx + dz * dz;
        const minD = e.radius + o.radius;
        if (d2 < minD * minD && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          np.x += (dx / d) * (minD - d) * 0.5;
          np.z += (dz / d) * (minD - d) * 0.5;
        }
      }
      collideBox(np, e.radius);
      g.position.x = np.x;
      g.position.z = np.z;

      e.phase += dt * (6 + e.speed);
      const sw = Math.sin(e.phase);
      e.legL.rotation.x = sw * 0.9; e.legR.rotation.x = -sw * 0.9;
      e.armL.rotation.x = -sw * 0.7; e.armR.rotation.x = sw * 0.7;
      e.torso.rotation.z = Math.sin(e.phase * 2) * 0.05;
      g.position.y = Math.abs(Math.sin(e.phase)) * 0.08;
    } else {
      e.attackCd -= dt;
      e.phase += dt * 10;
      e.armL.rotation.x = -1.2 - Math.sin(e.phase * 6) * 0.6;
      e.armR.rotation.x = -1.2 - Math.sin(e.phase * 6 + 1) * 0.6;
      e.legL.rotation.x = 0.2; e.legR.rotation.x = -0.2;
      if (e.attackCd <= 0) {
        e.attackCd = 0.9;
        damagePlayerLocal(e.kind === "heavy" ? 18 : e.kind === "fast" ? 7 : 11);
        g.userData.knock = toPlayer.clone().multiplyScalar(-0.15);
      }
    }
  }
}

function damagePlayerLocal(amount) {
  if (!state.running || !state.alive) return;
  state.health -= amount;
  state.sinceHit = 0;
  flashDamage();
  sfx.hurt();
  if (state.health <= 0) { state.health = 0; endGame(true); }
}

/* ========================================================================
   FX update
   ====================================================================== */
function updateFX(dt) {
  muzzleLight.intensity *= Math.pow(0.001, dt);
  if (muzzleLight.intensity < 0.02) muzzleLight.intensity = 0;
  flashMat.opacity *= Math.pow(0.0001, dt);

  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i];
    t.userData.life -= dt;
    t.material.opacity = Math.max(0, t.userData.life / 0.08) * 0.9;
    if (t.userData.life <= 0) { scene.remove(t); t.geometry.dispose(); tracers.splice(i, 1); }
  }

  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.userData.life -= dt;
    const pos = b.geometry.attributes.position;
    const vel = b.userData.vel;
    for (let j = 0; j < vel.length; j++) {
      vel[j].y -= 9 * dt;
      pos.array[j * 3] += vel[j].x * dt;
      pos.array[j * 3 + 1] += vel[j].y * dt;
      pos.array[j * 3 + 2] += vel[j].z * dt;
      if (pos.array[j * 3 + 1] < 0.02) { pos.array[j * 3 + 1] = 0.02; vel[j].multiplyScalar(0.4); }
    }
    pos.needsUpdate = true;
    b.material.opacity = Math.max(0, b.userData.life / b.userData.max);
    if (b.userData.life <= 0) { scene.remove(b); b.geometry.dispose(); b.material.dispose(); bursts.splice(i, 1); }
  }

  grid.material.opacity = 0.28 + Math.sin(performance.now() * 0.002) * 0.08;
}

/* ========================================================================
   Input
   ====================================================================== */
const keys = Object.create(null);
document.addEventListener("keydown", (e) => {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  keys[e.code] = true;
  if (e.code === "KeyR") reload();
  if (e.code === "Space" && state.onGround && state.running && state.alive) { state.velY = 5.2; state.onGround = false; }
});
document.addEventListener("keyup", (e) => { keys[e.code] = false; });
renderer.domElement.addEventListener("mousedown", (e) => { if (e.button === 0) firing = true; });
document.addEventListener("mouseup", (e) => { if (e.button === 0) firing = false; });

const PITCH_LIMIT = Math.PI / 2 - 0.05;
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== renderer.domElement) return;
  const s = 0.0022;
  yawObject.rotation.y -= e.movementX * s;
  pitchObject.rotation.x -= e.movementY * s;
  pitchObject.rotation.x = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitchObject.rotation.x));
});
function lockPointer() {
  try {
    const r = renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
    if (r && r.catch) r.catch(() => {}); // ignore (e.g. sandboxed preview iframe)
  } catch (_) {}
}
document.addEventListener("pointerlockchange", () => {
  if (document.pointerLockElement !== renderer.domElement) firing = false;
});
renderer.domElement.addEventListener("click", () => {
  if (state.running && document.pointerLockElement !== renderer.domElement) lockPointer();
});

/* ========================================================================
   Main loop
   ====================================================================== */
const clock = new T.Clock();
let netAccum = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state.running) {
    state.fireCd -= dt;
    if (state.reloading) { state.reloadT -= dt; if (state.reloadT <= 0) finishReload(); }
    if (firing) shoot();

    updatePlayer(dt);

    if (NET.mode === "online") {
      updateEnemiesOnline(dt);
      updateRemotePlayers(dt);
      netAccum += dt;
      if (netAccum >= 0.05) {
        netAccum = 0;
        netSend({
          t: "state",
          x: +yawObject.position.x.toFixed(2), y: +yawObject.position.y.toFixed(2), z: +yawObject.position.z.toFixed(2),
          ry: +yawObject.rotation.y.toFixed(3), rx: +pitchObject.rotation.x.toFixed(3),
          mv: state.moving,
        });
      }
    } else {
      updateEnemiesLocal(dt);
      maybeSpawnLocal(dt);
      state.sinceHit += dt;
      if (state.sinceHit > 4 && state.health < 100) state.health = Math.min(100, state.health + 7 * dt);
    }

    updateHUD();
  } else {
    if (NET.mode === "online") updateRemotePlayers(dt);
  }

  updateFX(dt);
  renderer.render(scene, camera);
}
animate();

/* ========================================================================
   Start / end
   ====================================================================== */
function clearEntities() {
  for (const e of enemies) scene.remove(e.group);
  enemies.length = 0;
  enemyRaycastTargets.length = 0;
  for (const t of tracers) scene.remove(t);
  tracers.length = 0;
  for (const b of bursts) scene.remove(b);
  bursts.length = 0;
}

function resetLocalState() {
  state.health = 100; state.score = 0; state.kills = 0; state.wave = 0;
  state.mag = 30; state.reserve = 120; state.reloading = false; state.reloadT = 0;
  state.fireCd = 0; state.velY = 0; state.onGround = true; state.sinceHit = 0; state.alive = true;
  const ang = Math.random() * Math.PI * 2;
  const rad = NET.mode === "online" ? 4 + Math.random() * 6 : 0;
  yawObject.position.set(Math.cos(ang) * rad, 1.7, Math.sin(ang) * rad);
  yawObject.rotation.y = -ang + Math.PI; // roughly face the centre
  pitchObject.rotation.x = 0;
}

function beginGame() {
  audioInit();
  if (actx && actx.state === "suspended") actx.resume();
  el("startScreen").classList.add("hidden");
  el("gameOver").classList.add("hidden");
  hud.classList.remove("hidden");

  clearEntities();
  resetLocalState();
  state.running = true;

  if (NET.mode === "online") {
    netSend({ t: "respawn" });
  } else {
    startWaveLocal(1);
  }
  updateHUD();
  lockPointer();
}

function endGame(showOverlay) {
  state.alive = false;
  firing = false;
  if (showOverlay === false) {
    // downed in co-op: keep world running, show overlay to redeploy
  }
  state.running = false;
  if (document.exitPointerLock) document.exitPointerLock();
  el("goTitle").textContent = NET.mode === "online" ? "YOU ARE DOWN" : "GRID LOST";
  el("restartBtn").textContent = NET.mode === "online" ? "REDEPLOY" : "RETRY";
  el("finalStats").innerHTML = `WAVE ${state.wave} &nbsp;·&nbsp; ${state.kills} KILLS &nbsp;·&nbsp; ${state.score} PTS`;
  el("gameOver").classList.remove("hidden");
  hud.classList.add("hidden");
}

el("startBtn").addEventListener("click", beginGame);
el("restartBtn").addEventListener("click", () => {
  if (NET.mode === "online") {
    // rejoin the ongoing match
    el("gameOver").classList.add("hidden");
    hud.classList.remove("hidden");
    resetLocalState();
    state.running = true;
    netSend({ t: "respawn" });
    updateHUD();
    lockPointer();
  } else {
    beginGame();
  }
});

/* ========================================================================
   Connect on load, then reflect status on the start screen
   ====================================================================== */
const nameInput = el("nameInput");
try { nameInput.value = localStorage.getItem("nb_name") || ""; } catch (_) {}
nameInput.addEventListener("input", () => {
  NET.name = nameInput.value.trim() || "PLAYER";
  try { localStorage.setItem("nb_name", nameInput.value.trim()); } catch (_) {}
});
NET.name = nameInput.value.trim() || ("PLAYER-" + Math.floor(Math.random() * 900 + 100));

netConnect((mode) => {
  const line = el("netLine");
  if (mode === "online") {
    line.innerHTML = `<b>ONLINE</b> — co-op server connected. Others join at <b>${location.host}</b>`;
  } else {
    line.innerHTML = `<b>SOLO</b> — no server found, playing offline. Run <b>node server.js</b> for co-op.`;
  }
});

// keep name synced if user connects before typing
setInterval(() => {
  if (NET.mode === "online" && NET.ws && NET.ws.readyState === 1) {
    const n = nameInput.value.trim();
    if (n && n !== NET._sentName) { NET._sentName = n; netSend({ t: "join", name: n }); }
  }
}, 1000);

/* ========================================================================
   Resize
   ====================================================================== */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
